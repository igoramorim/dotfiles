set -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

# move between panes using prefix + key (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# split window using prefix + | (vertical) or prefix + - (horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# close current pane using prefix + q
bind q kill-pane

# don't rename windows automatically
set-option -g allow-rename off

set -g mouse on
setw -g mode-keys vi

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#262b33'
set -g status-left ''
# set -g status-interval 5
# set -g status-right-style 'fg=#6E94AD'
# set -g status-right ' %a %d/%m/%Y %T '
set -g status-right ''

# panes
set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=blue'

# window bar
setw -g window-status-current-style 'fg=#262b33 bg=#6E94AD'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=#6E94AD bg=#262b33'

# command bar
set -g message-style 'fg=white bg=black'

# plugins
set -g @plugin 'tmux-plugins/tmux-sensible'

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
